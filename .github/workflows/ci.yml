name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── TypeScript / JS ────────────────────────────────────────────────────────
  js-lint-typecheck:
    name: JS — Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  js-test:
    name: JS — Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aipen
          POSTGRES_PASSWORD: aipen
          POSTGRES_DB: aipen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aipen:aipen@localhost:5432/aipen_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --reporter=verbose

  # ─── Python / FastAPI ───────────────────────────────────────────────────────
  python-lint:
    name: Python — Ruff & Mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app/

  python-test:
    name: Python — Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/inference
    env:
      MODEL_VERSION: microsoft/trocr-base-handwritten
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-trocr-base-${{ hashFiles('services/inference/requirements.txt') }}
      - run: pytest -v --tb=short

  # ─── Summary Gate ───────────────────────────────────────────────────────────
  all-green:
    name: All checks green
    runs-on: ubuntu-latest
    needs: [js-lint-typecheck, js-test, python-lint, python-test]
    steps:
      - run: echo "✅ All CI checks passed"
